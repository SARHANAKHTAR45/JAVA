<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real-Time Chat Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.0/bundles/stomp.umd.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #dbeafe, #e0e7ff, #f3e8ff);
            min-height: 100vh;
        }
    </style>
</head>
<body>

    <div class="container mt-4">
        <h1 class="text-center">Real-Time Chat Application</h1>
        <div id="chat"
             class="border rounded p-3 mb-3"
             style="height: 300px; overflow-y: auto;">
        </div>
        <div class="input-group mb-3">

            <input id="senderInput"
                   type="text"
                   class="form-control"
                   placeholder="Your name..."/>

            <input id="messageInput"
                   type="text"
                   class="form-control"
                   placeholder="Type a message..."/>
            <button id="sendMessage"
                    class="btn btn-primary"
                    disabled>
                Send
            </button>
        </div>
    </div>
<script>
    var stompClient = null;
    function setConnected(connected) {
        document.getElementById('sendMessage').disabled = !connected;

    }

    function connect() {
        stompClient = new StompJs.Client({
            brokerURL: 'ws://localhost:8080/ws',
            onConnect: function(frame) {
                console.log('Connected: ' + frame);
                setConnected(true);
                stompClient.subscribe('/topic/messages', function(message) {
                    showMessage(JSON.parse(message.body));
                });
            },
            onStompError: function(frame) {
                console.log('STOMP error:', frame);
            },
            onWebSocketError: function(error) {
                console.log('WebSocket error:', error);
            }
        });
        stompClient.activate();
    }

    function showMessage(message) {
        var chat = document.getElementById('chat');
        var messageElement = document.createElement('div');
        messageElement.textContent =
            message.sender + ': ' + message.content;
        messageElement.className = 'border-bottom mb-1';
        chat.appendChild(messageElement);
        chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
        var sender =
            document.getElementById('senderInput').value;
        var content =
            document.getElementById('messageInput').value;
        if (sender.trim() === '' || content.trim() === '') {
            return;
        }
        var chatMessage = {
            sender: sender,
            content: content
        };
        stompClient.publish({
            destination: '/app/sendMessage',
            body: JSON.stringify(chatMessage)
        });
        document.getElementById('messageInput').value = '';
    }
    document.getElementById('sendMessage').onclick = sendMessage;
    window.onload = connect;
</script>
</body>
</html>
